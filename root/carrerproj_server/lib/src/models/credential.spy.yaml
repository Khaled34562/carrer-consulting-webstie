class: Credentials
table: credentials
fields:
  userId: int, relation(parent=user_profile)
  name: String
  date: DateTime
  version: String
  fileUrl: String # This will store the URL of the credential
  description: String?
  issuer: String?
  expirationDate: DateTime?
  status: String? # e.g., "Pending", "Approved", "Rejected"