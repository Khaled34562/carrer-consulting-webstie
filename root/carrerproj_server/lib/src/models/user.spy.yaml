class: User
table: user
fields:
  userId: int, relation(parent=serverpod_user_info)
  role: String
  fullName: String
  nickname: String
  dateOfBirth: DateTime
  gender: String
  profileImage: String?
  country: String
  languages: List<String>
  timezone: String
  creditCardInfo: String?
  educationLevel: String?
  hourlyRate: double?
indexes:
  user_unique_idx:
    fields: userId
    unique: true
